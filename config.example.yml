# JobForge configuration
# Copy to config.yml and edit. Paths are relative to the repository root.

data_dir: data
output_dir: output
profile: null          # optional YAML/JSON profile override
resume: null           # optional base resume path (PDF/DOCX/TXT/MD)

sources:
  greenhouse:
    boards: []         # e.g. [stripe, discord]
  lever:
    boards: []         # e.g. [leverdemo, spotify]
  ashby:
    boards: []         # e.g. [linear]
  workable:
    boards: []         # e.g. [seedlegals]
  smartrecruiters:
    companies: []      # e.g. [Ubisoft]
  github_jobs:
    repos: []          # e.g. [SimplifyJobs/New-Grad-Positions]
  workday:
    boards: []         # e.g. ["acme|wd1|External"] or a myworkdayjobs.com board URL
  nyc_opendata:
    query: "software"
    limit: 200
    enabled: false     # keyless NYC public-sector postings
  usajobs:
    keyword: "software engineer"
    limit: 50
    enabled: false     # needs USAJOBS_API_KEY + USAJOBS_EMAIL

# Scan-wide title gate and per-run budget. Empty keyword lists keep everything.
# max_new limits inserted jobs per scan (0 = unlimited); later scans pick up
# the deferred rows because already-seen fingerprints do not consume the cap.
scan:
  keywords: []            # e.g. [software engineer, backend, data engineer]
  exclude_keywords: []    # e.g. [senior, staff, principal]
  max_new: 250

# Seed preferences on first run. Stored in SQLite afterwards.
preferences:
  titles: []
  industries: []
  locations: ["New York, NY"]
  work_modes: ["remote", "hybrid", "onsite"]
  employment_types: ["full-time"]
  experience_levels: ["entry", "junior"]
  years_of_experience: 1
  salary_min: 0
  salary_max: null
  needs_sponsorship: false
  security_clearance: "none"
  excluded_companies: []
  excluded_keywords: []
  included_keywords: []
  min_match: 55
  one_application_per_company: true

# Local feature flags. All default to true; env vars override individual flags.
#   JOBFORGE_FEATURE_SETUP_WIZARD=0
#   JOBFORGE_FEATURE_GITHUB_CONNECTIONS=0
#   JOBFORGE_FEATURE_SCORING_V2=0
#   JOBFORGE_FEATURE_AGENT=0
#   JOBFORGE_FEATURE_AGENT_INTEGRATIONS=0
features:
  setup_wizard: true
  github_connections: true
  scoring_v2: true
  agent: true
  agent_integrations: true

# GitHub is connected from the dashboard (Connections). It is intentionally
# absent here. Set GITHUB_TOKEN or JOBFORGE_GITHUB_TOKEN to avoid storing a copy.

# Model providers are connected from the dashboard (Models). API keys are
# stored in the OS keychain or a local 0600 file, never in this file. Set
# JOBFORGE_LLM_PROVIDER / MODEL / BASE_URL to override at startup.
llm:
  enabled: false
  provider: ollama
  base_url: "http://localhost:11434/v1"
  model: "llama3.1:8b"
  timeout: 120
  temperature: 0.2
  max_tokens: 4096

# Resume tailoring. auto uses the LLM when a provider is available and falls
# back to the deterministic selector; llm requires a provider; deterministic
# skips the LLM entirely. Automated grounding checks (not semantic proof) still gate output.
tailoring:
  mode: auto

# The agent is read/write-gated per message. Writes are enabled only when the
# user checks "Allow actions" for that message.
agent:
  max_steps: 8
  max_seconds: 300
  max_tool_calls: 6
  allow_writes: false

email:
  enabled: false
  host: "imap.gmail.com"
  port: 993
  username: ""
  password_env: "JOBFORGE_IMAP_PASSWORD"
  folder: "INBOX"
  lookback_days: 30
  verification_domains: []
  verification_senders: []

browser:
  headless: false
  user_data_dir: "data/browser"
  channel: ""           # "chrome" uses system Chrome instead of bundled Chromium
  slow_mo: 0
  timeout_ms: 30000
  allow_submit: false   # keep false: human clicks Submit

server:
  host: "127.0.0.1"
  port: 8765
  access_token: ""      # optional bearer token if you bind beyond localhost

# Risky modes are OFF by default and stored in data/risk.json, not this file.
# See docs/13-risk-consent.md. Enable with:
#   python -m jobforge risk enable --flag unattended_submit \
#     --acknowledge "I UNDERSTAND THE RISK"
