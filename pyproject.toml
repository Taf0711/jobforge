[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge"
version = "0.4.1"
description = "A local-first job search workbench: discover, score, tailor, fill, and track applications."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tafseer Haque" }]
keywords = ["jobs", "resume", "ats", "local-first", "playwright"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "playwright>=1.64",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jobforge = "jobforge.cli:main"

[project.urls]
README = "https://github.com/Taf0711/jobforge"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["jobforge*"]

[tool.setuptools.package-data]
jobforge = [
  "data/*",
  "matching/*.yml",
  "tailoring/*.typ",
  "web/templates/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
