<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme — Ashby application</title></head>
<body>
  <main>
    <h1>Software Engineer</h1>
    <form action="/apply" method="post">
      <div class="field">
        <label for="_systemfield_name">Full name</label>
        <input id="_systemfield_name" name="_systemfield_name" type="text" required>
      </div>
      <div class="field">
        <label for="_systemfield_email">Email</label>
        <input id="_systemfield_email" name="_systemfield_email" type="email" required>
      </div>
      <div class="field">
        <label for="_systemfield_phone">Phone</label>
        <input id="_systemfield_phone" name="_systemfield_phone" type="tel">
      </div>
      <div class="field">
        <label for="_systemfield_location">Current location</label>
        <input id="_systemfield_location" name="_systemfield_location" type="text" required>
      </div>
      <div class="field">
        <label for="_systemfield_company">Current company</label>
        <input id="_systemfield_company" name="_systemfield_company" type="text">
      </div>
      <div class="field">
        <label for="_systemfield_linkedin">LinkedIn URL</label>
        <input id="_systemfield_linkedin" name="_systemfield_linkedin" type="url">
      </div>
      <div class="field">
        <label for="_systemfield_github">GitHub URL</label>
        <input id="_systemfield_github" name="_systemfield_github" type="url">
      </div>
      <div class="field">
        <label for="_systemfield_resume">Resume</label>
        <input id="_systemfield_resume" name="_systemfield_resume" type="file" accept=".pdf,.doc,.docx" required>
      </div>
      <div class="field">
        <label for="_systemfield_why">Why N1?</label>
        <textarea id="_systemfield_why" name="_systemfield_why" rows="4" required></textarea>
      </div>
      <fieldset>
        <legend>Are you authorized to work in the United States?</legend>
        <label><input type="radio" name="work_auth" value="yes"> Yes</label>
        <label><input type="radio" name="work_auth" value="no"> No</label>
      </fieldset>
      <div class="field">
        <label for="_systemfield_gender">Gender</label>
        <select id="_systemfield_gender" name="_systemfield_gender">
          <option value="">Select...</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="nonbinary">Non-binary</option>
          <option value="decline">Decline to self-identify</option>
        </select>
      </div>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
