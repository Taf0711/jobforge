<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobForge{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Job<span>Forge</span></a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
      <a href="/jobs" class="{{ 'active' if request.url.path.startswith('/jobs') else '' }}">Jobs</a>
      <a href="/applications" class="{{ 'active' if request.url.path.startswith('/applications') else '' }}">Applications</a>
      <a href="/queue" class="{{ 'active' if request.url.path.startswith('/queue') else '' }}">Queue</a>
      <a href="/answers" class="{{ 'active' if request.url.path.startswith('/answers') else '' }}">Answers</a>
      <a href="/inbox" class="{{ 'active' if request.url.path.startswith('/inbox') else '' }}">Inbox</a>
      <a href="/profiles" class="{{ 'active' if request.url.path.startswith('/profiles') else '' }}">Profiles</a>
      <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') else '' }}">Settings</a>
      <a href="/runs" class="{{ 'active' if request.url.path.startswith('/runs') else '' }}">Runs</a>
    </nav>
    <span class="who">{{ profile.full_name or profile.name }}</span>
  </header>

  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Local-first. No account, no telemetry. Applications are filled by a browser you control; you click Submit.
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
